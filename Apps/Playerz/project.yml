name: Playerz
options:
  bundleIdPrefix: bg.playerz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Bulgarian is the DEVELOPMENT language, not a translation of an English
  # original. `DEFAULT_LOCALE = 'bg'` on the server, the message catalogues are
  # at parity with bg as the reference, and the audience is Bulgarian. An app
  # whose base language is English gets English fallbacks for anything missed,
  # which is the wrong direction to fail in.
  developmentLanguage: bg

packages:
  PlayerzAPI:
    path: ../..

targets:
  Playerz:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: PlayerzAPI
        product: PlayerzAPI
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: playerz.bg
        # Required since iOS 11; an upload WITHOUT it is rejected outright.
        # Xcode injects it only when it generates the Info.plist, and this
        # target supplies one, so it has to be stated.
        CFBundleIconName: AppIcon
        # By reference, not by value: XcodeGen otherwise writes the numbers
        # into Info.plist as literals, and the TestFlight workflow's
        # CURRENT_PROJECT_VERSION never reaches the bundle (its first archive
        # came out as build "1", which the bundle check refused).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Xcode adds this only to a plist it generates itself; this target
        # supplies its own (agrent-ios found it missing from an archive).
        LSRequiresIPhoneOS: true
        CFBundleDevelopmentRegion: bg
        CFBundleLocalizations: [bg, en]
        UILaunchScreen: {}
        # Sofia Sans Extra Condensed (OFL, Resources/Fonts/SofiaSans-OFL.txt),
        # by a Bulgarian type foundry: the athletic headlines (owner
        # 2026-11-13: "more sports feeling", Nike / Under Armour / On).
        UIAppFonts:
          - SofiaSansExtraCondensed-BlackItalic.ttf
          - SofiaSansExtraCondensed-ExtraBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # WeatherKit attribution is a REQUIREMENT, not a courtesy (#211), so the
        # capability is declared where the forecast row will read it.
        NSLocationWhenInUseUsageDescription: >-
          Използва се, за да покаже кортовете близо до вас.
        # The coach photographs their certificate (#20). Without this key iOS
        # ends the app the moment the camera opens (#47). Photos from the
        # library come through PhotosPicker, which needs no permission.
        NSCameraUsageDescription: >-
          Използва се, за да снимате сертификата си на треньор.
        # ═══ EXPORT COMPLIANCE ═══
        #
        # Declared here so every upload does not stop to ask. The app uses only
        # HTTPS and the Keychain — standard OS cryptography — which is exempt
        # under the US regulations App Store Connect is asking about. Without
        # this key, TestFlight holds each build behind a manual answer to the
        # same question.
        #
        # This becomes a LIE the moment the app ships its own encryption
        # (custom crypto, a bundled library, or proprietary key exchange). It
        # is not a formality to copy forward unread.
        ITSAppUsesNonExemptEncryption: false
        # Read by SessionModel. The server a Release build talks to, and the
        # app's Google iOS OAuth client: both from the build settings below,
        # so a Debug build has neither and asks for a server instead.
        PlayerzServerURL: $(PLAYERZ_SERVER_URL)
        PlayerzGoogleClientID: $(PLAYERZ_GOOGLE_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bg.playerz.app
        DEVELOPMENT_TEAM: 9423GKWL67
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        # The app's iOS OAuth client in the Google Cloud project (docs/
        # oauth-setup.md §5 in projectZ): the `aud` the server checks the ID
        # token against (GOOGLE_IOS_CLIENT_ID). Not a secret: an iOS client
        # has none, and its ID is in every build. Empty → no Google button (owner created it 2026-11-13).
        PLAYERZ_GOOGLE_CLIENT_ID: 880736019978-q0kun58arhssj19ihmmsesmeau2hflbf.apps.googleusercontent.com
      # Per configuration, because the APNs environment is. See the comments in
      # the two files: the entitlement and PushRegistrar.environment must agree,
      # and both now derive from the build configuration rather than from
      # somebody remembering.
      configs:
        debug:
          CODE_SIGN_ENTITLEMENTS: Playerz.debug.entitlements
          # Typed on the sign-in screen, or PLAYERZ_SERVER_URL at launch.
          PLAYERZ_SERVER_URL: ""
        release:
          CODE_SIGN_ENTITLEMENTS: Playerz.release.entitlements
          # TestFlight and the App Store: production, with no field to change it.
          PLAYERZ_SERVER_URL: https://playerz.bg
