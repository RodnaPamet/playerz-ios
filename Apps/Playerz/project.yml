name: Playerz
options:
  bundleIdPrefix: bg.playerz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Bulgarian is the DEVELOPMENT language, not a translation of an English
  # original. `DEFAULT_LOCALE = 'bg'` on the server, the message catalogues are
  # at parity with bg as the reference, and the audience is Bulgarian. An app
  # whose base language is English gets English fallbacks for anything missed,
  # which is the wrong direction to fail in.
  developmentLanguage: bg

packages:
  PlayerzAPI:
    path: ../..

targets:
  Playerz:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: PlayerzAPI
        product: PlayerzAPI
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: playerz.bg
        # Required since iOS 11; an upload WITHOUT it is rejected outright.
        # Xcode injects it only when it generates the Info.plist, and this
        # target supplies one, so it has to be stated.
        CFBundleIconName: AppIcon
        CFBundleDevelopmentRegion: bg
        CFBundleLocalizations: [bg, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # WeatherKit attribution is a REQUIREMENT, not a courtesy (#211), so the
        # capability is declared where the forecast row will read it.
        NSLocationWhenInUseUsageDescription: >-
          Използва се, за да покаже кортовете близо до вас.
        # ═══ EXPORT COMPLIANCE ═══
        #
        # Declared here so every upload does not stop to ask. The app uses only
        # HTTPS and the Keychain — standard OS cryptography — which is exempt
        # under the US regulations App Store Connect is asking about. Without
        # this key, TestFlight holds each build behind a manual answer to the
        # same question.
        #
        # This becomes a LIE the moment the app ships its own encryption
        # (custom crypto, a bundled library, or proprietary key exchange). It
        # is not a formality to copy forward unread.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bg.playerz.app
        DEVELOPMENT_TEAM: 9423GKWL67
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
      # Per configuration, because the APNs environment is. See the comments in
      # the two files: the entitlement and PushRegistrar.environment must agree,
      # and both now derive from the build configuration rather than from
      # somebody remembering.
      configs:
        debug:
          CODE_SIGN_ENTITLEMENTS: Playerz.debug.entitlements
        release:
          CODE_SIGN_ENTITLEMENTS: Playerz.release.entitlements
