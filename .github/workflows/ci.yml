name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # macOS, not ubuntu: the client is built by a SwiftPM plugin and the tests
    # use Swift Testing, which ships inside Xcode's MacOSX platform rather than
    # the open-source toolchain.
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # `make` exports DEVELOPER_DIR only if it is not already set, so this
        # decides the toolchain for the whole job.
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || \
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: make build

      - name: Test
        run: make test

  app-release:
    # The app itself, as TestFlight archives it: Release, so the `#else`
    # side of every `#if DEBUG` compiles. `make build` above builds only the
    # package; a Release-only error (DebugLaunch.sport, #105) first showed up
    # as a failed TestFlight upload after the merge.
    name: The app compiles in Release
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Apps/Playerz
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || \
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      # The simulator, unsigned: no certificate or key in a PR's job.
      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Playerz.xcodeproj -scheme Playerz -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/release-dd" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|\*\* BUILD" \
            || { echo "::error::the Release build failed"; tail -80 "$RUNNER_TEMP/build.log"; exit 1; }

  spec-drift:
    name: OpenAPI spec matches the server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Check out the server repo
        uses: actions/checkout@v4
        with:
          repository: RodnaPamet/projectZ
          path: .server

      - name: The vendored spec must match the server's
        # ═══ WHY THIS IS A SEPARATE JOB ═══
        #
        # Sources/PlayerzAPI/openapi.json is a COPY. The client is generated
        # from it, so if the server's spec moves and this copy does not, the
        # client keeps compiling and keeps calling an API that has changed —
        # which fails at runtime, in a shipped binary, and nowhere earlier.
        #
        # A guardrail in the server repo keeps ITS spec in step with ITS routes.
        # This keeps the copy in step with that spec. Together they reach from a
        # route handler to a Swift method name.
        #
        # Compared as PARSED JSON, not as bytes. The first version of this job
        # diffed the files directly and failed on its very next run — the server
        # reformats its copy through prettier on commit, so 861 lines of
        # whitespace differed while the contract was identical.
        #
        # A byte check is not stricter in any way that matters: the generator
        # parses this file, so formatting cannot reach the generated client. It
        # is only noisier, and a job that cries wolf on whitespace is a job
        # people learn to ignore — which is worse than not having it.
        #
        # For the same reason, PROSE is not compared (#39): a reworded
        # description or summary reaches the client only as a doc comment, and
        # failing every open app PR because the server reworded one sentence
        # cried wolf three times in one day. Shapes, names, types, required
        # fields and paths are all still compared. `make regenerate` still
        # copies the prose, so the doc comments catch up with the next copy.
        run: |
          python3 - <<'PY'
          import json, sys

          # The vendored copy is the server's spec put through the rewrite the
          # generator needs (#6), so the comparison applies it too.
          sys.path.insert(0, 'scripts')
          from spec_for_swift import for_swift

          PROSE = {'description', 'summary', 'example', 'examples'}

          def shape(node, in_properties=False):
              """The spec without its prose. Under `properties` the keys are
              property NAMES, and a property may be called `description`."""
              if isinstance(node, list):
                  return [shape(v) for v in node]
              if not isinstance(node, dict):
                  return node
              return {
                  k: shape(v, k == 'properties')
                  for k, v in node.items()
                  if in_properties or k not in PROSE
              }

          server = for_swift(json.load(open('.server/openapi/playerz-v1.json')))
          vendored = json.load(open('Sources/PlayerzAPI/openapi.json'))

          if server == vendored:
              print('spec matches RodnaPamet/projectZ@main')
              sys.exit(0)
          if shape(server) == shape(vendored):
              print('::notice::Only prose differs from RodnaPamet/projectZ@main; `make regenerate` will copy it.')
              sys.exit(0)

          print('::error::The vendored OpenAPI spec is out of date. Run `make regenerate` and commit.')

          # Say WHICH operations moved, so the failure is actionable without
          # diffing a 180KB file by hand.
          def ops(doc):
              return {
                  f'{method.upper()} {path}'
                  for path, item in doc.get('paths', {}).items()
                  for method, op in item.items()
                  if isinstance(op, dict)
              }

          added, removed = ops(server) - ops(vendored), ops(vendored) - ops(server)
          for op in sorted(added):
              print(f'  + {op} (on the server, missing here)')
          for op in sorted(removed):
              print(f'  - {op} (here, gone from the server)')
          if not added and not removed:
              print('  operations match; a schema changed')
          sys.exit(1)
          PY
